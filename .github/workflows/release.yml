name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 校验版本号
        run: test "v$(cat VERSION)" = "${GITHUB_REF_NAME}"
      - run: go test ./...
      - run: make dist
      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/sshdesktop-linux-amd64 dist/sshdesktop-linux-arm64 \
            dist/sshdesktop-agent-linux-amd64 dist/sshdesktop-agent-linux-arm64 dist/SHA256SUMS \
            --title "sshDesktop $GITHUB_REF_NAME" --generate-notes
